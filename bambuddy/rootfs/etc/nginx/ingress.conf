# ==============================================================================
# Home Assistant App: BamBuddy
# Home Assistant Ingress: Supervisor -> nginx -> BamBuddy on 127.0.0.1:8000.
# Template: the "nginx" service fills in %%INGRESS_PORT%% at startup.
#
# Ingress serves the app below /api/hassio_ingress/<token>/. The rebuilt
# frontend (ingress/) finds that prefix itself; nginx only covers what reaches
# the browser before any JavaScript runs: the URLs in index.html, redirects and
# the frame-embedding headers.
# ==============================================================================

worker_processes 1;
pid /run/nginx-ingress.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;

    # Uploads (3MF, STL, G-code, backups) go straight through; BamBuddy
    # applies its own limits. Camera streams (MJPEG) and the WebSocket must
    # not be buffered or cut off.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The prefix the Supervisor sends. Anything that does not look like one is
    # ignored, so it can never be written into a page.
    map $http_x_ingress_path $ingress_path {
        "~^/api/hassio_ingress/[A-Za-z0-9_-]+$" $http_x_ingress_path;
        default "";
    }

    # BamBuddy only lets its trusted_frame_origins embed it. The Ingress panel
    # is Home Assistant on the same origin, so here frame-ancestors is 'self',
    # whatever that option says. The rest of the policy stays as it is.
    map $upstream_http_content_security_policy $ingress_csp {
        "~^(?<csp_before>.*)frame-ancestors[^;]*(?<csp_after>.*)$" "${csp_before}frame-ancestors 'self'${csp_after}";
        default $upstream_http_content_security_policy;
    }

    server {
        listen %%INGRESS_PORT%%;

        # Only the Supervisor's Ingress proxy. With host_network the port is
        # open on the host, so everything else is refused.
        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Uncompressed, so sub_filter below can read the HTML.
            proxy_set_header Accept-Encoding "";

            # Should BamBuddy redirect to itself (relative, or absolute with the
            # Host nginx sent), keep it below the prefix. Redirects elsewhere,
            # e.g. to an OIDC provider, are left alone.
            proxy_redirect http://$host/ $ingress_path/;
            proxy_redirect ~^(/.*)$ $ingress_path$1;

            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy $ingress_csp always;
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options SAMEORIGIN always;

            # index.html loads /assets/..., /img/..., /manifest.json from the
            # root of the origin.
            sub_filter_once off;
            sub_filter 'src="/' 'src="$ingress_path/';
            sub_filter 'href="/' 'href="$ingress_path/';
        }
    }
}
