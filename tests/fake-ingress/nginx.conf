# Stand-in for the Supervisor's Ingress proxy and Home Assistant in front of it,
# used by tests/ingress.sh. Like the real one it serves the app below
# /api/hassio_ingress/<token>/, strips that prefix, sends X-Ingress-Path, and
# connects to the app from 172.30.32.2 (the container gets that address).
events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Home Assistant's own pages. A request the app sends here instead of
        # under its prefix is a bug, and the browser test reports it.
        location / {
            return 404;
        }

        # The Ingress panel: Home Assistant embeds the app in a same-origin iframe.
        location = /panel {
            default_type text/html;
            return 200 '<!doctype html><title>panel</title><iframe id="app" src="/api/hassio_ingress/smoketoken/" style="width:1280px;height:800px;border:0"></iframe>';
        }

        location /api/hassio_ingress/smoketoken/ {
            proxy_pass http://172.30.32.20:8099/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Ingress-Path /api/hassio_ingress/smoketoken;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            client_max_body_size 0;
        }
    }
}
