# https://developers.home-assistant.io/docs/apps/configuration/#app-configuration
name: BamBuddy (Daily)
version: "1.2.6b1-daily.20260925"
slug: bambuddy_daily
stage: experimental
description: BamBuddy is a powerful, self-hosted command center for Bambu Lab — from one A1 to an entire print farm. Your Printers. No Cloud. Your Rules.
url: "https://github.com/Spegeli/homeassistant-app-bambuddy"
# Prebuilt multi-arch image from GHCR; the Supervisor appends :<version>.
image: ghcr.io/spegeli/homeassistant-app-bambuddy-daily
arch:
  - aarch64
  - amd64
init: false            # required for s6-overlay v3
timeout: 30            # stop timeout, matches upstream's stop_grace_period
host_network: true     # SSDP printer discovery + the virtual printer's host ports
# NET_RAW is not in the default capability set; the virtual printer needs it.
privileged:
  - NET_RAW
homeassistant_api: true  # Core API proxy for the HA integration
# addon_config survives an uninstall (unlike /data); share/media are always
# mounted but only exposed when enable_share / enable_media are on.
map:
  - addon_config:rw
  - share:rw
  - media:rw
options:
  trusted_frame_origins:
    - "http://homeassistant.local:8123"
  enable_share: false
  enable_media: false
  use_system_trust_store: false
  certfile: "custom_ca.crt"
  debug: false
schema:
  trusted_frame_origins:
    - str
  enable_share: bool
  enable_media: bool
  use_system_trust_store: bool
  certfile: str
  debug: bool
# Port 8000 is fixed: host_network ignores HA port mappings anyway.
webui: http://[HOST]:[PORT:8000]
watchdog: http://[HOST]:[PORT:8000]/health
