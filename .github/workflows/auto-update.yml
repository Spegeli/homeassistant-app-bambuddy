name: Auto-update

# Hourly: checks upstream for a new stable release and a new daily build and,
# per channel, runs check -> test -> build -> commit. Formerly
# update-versions.yml ("Auto-Update BamBuddy Versions").

# The run list shows whether a run came from the hourly schedule or was
# started by hand. Whether it built anything is decided later, inside the run.
run-name: ${{ github.event_name == 'schedule' && 'Auto-update (hourly)' || 'Auto-update (manual)' }}

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ============================================================
  # STABLE: check -> test -> build -> commit
  # ============================================================
  check-stable:
    name: Check STABLE
    runs-on: ubuntu-24.04
    concurrency:
      group: update-stable
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.decide.outputs.changed == 'true' && steps.blocked.outputs.blocked != 'true' }}
      version: ${{ steps.get_version.outputs.latest }}
      current: ${{ steps.get_current.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Get latest stable version from GitHub Releases
        id: get_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW=$(curl -s --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/maziggy/bambuddy/releases")

          if ! echo "$RAW" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::warning::GitHub API did not return a release array (rate limit / transient). Skipping this run."
            echo "latest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST=$(echo "$RAW" | jq -r '[.[] | select(.prerelease == false) | select(.tag_name | ltrimstr("v") | test("^[0-9]+\\.[0-9]+(\\.[0-9]+)*$"))] | sort_by(.published_at) | reverse | first | .tag_name // empty' | sed 's/^v//')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Found version: $LATEST"

      - name: Get current version from config.yaml
        id: get_current
        run: |
          CURRENT=$(grep '^version:' bambuddy/config.yaml | sed 's/.*"\(.*\)"/\1/')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT"

      - name: Decide
        id: decide
        run: |
          if [ -n "${{ steps.get_version.outputs.latest }}" ] && [ "${{ steps.get_version.outputs.latest }}" != "${{ steps.get_current.outputs.current }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip a version that already failed its tests
        id: blocked
        if: steps.decide.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed test run opens an issue naming the version. Without this
          # check the hourly cron would rebuild and retest the same broken
          # version every hour. Closing the issue releases the version again.
          TITLE="Auto-update blocked: stable ${{ steps.get_version.outputs.latest }}"
          FOUND=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json title \
            --jq "[.[] | select(.title == \"${TITLE}\")] | length")
          if [ "${FOUND}" != "0" ]; then
            echo "::notice::Skipping ${TITLE} - an open issue still blocks it"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

  test-stable:
    name: Test STABLE
    needs: check-stable
    if: needs.check-stable.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml
    with:
      context: bambuddy
      version: ${{ needs.check-stable.outputs.version }}
      smoke: true

  block-stable:
    name: Block STABLE on test failure
    needs: [check-stable, test-stable]
    if: always() && needs.test-stable.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open a blocking issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-stable.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Auto-update blocked: stable ${VERSION}"
          # printf, not a heredoc: inside a YAML block scalar the closing EOF
          # would be indented and would never terminate the heredoc.
          BODY=$(printf '%s\n' \
            "The STABLE auto-update to \`${VERSION}\` was stopped: the tests failed" \
            "before anything was pushed to GHCR or committed to \`config.yaml\`." \
            "" \
            "Failed run: ${RUN_URL}" \
            "" \
            "Nothing is broken for users - Home Assistant still serves the previous" \
            "version. The hourly job skips this version while this issue is open." \
            "" \
            "**Close this issue once the cause is fixed**, then the next run picks" \
            "the version up again.")
          gh issue create --title "${TITLE}" --label "bug" --body "${BODY}"

  build-stable:
    name: Build STABLE
    needs: [check-stable, test-stable]
    if: needs.check-stable.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      context: bambuddy
      image: ghcr.io/spegeli/homeassistant-app-bambuddy
      version: ${{ needs.check-stable.outputs.version }}

  commit-stable:
    name: Commit STABLE
    needs: [check-stable, build-stable]
    if: needs.check-stable.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Apply update and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check-stable.outputs.version }}"
          BODY=$(curl -s --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/maziggy/bambuddy/releases/tags/v${VERSION}" | jq -r '.body // empty')
          sed -i 's/^version: ".*"/version: "${{ needs.check-stable.outputs.version }}"/' bambuddy/config.yaml
          # Fail loudly if the bump did not land (e.g. the version: line was
          # reformatted and sed no longer matches). Silently committing nothing
          # would leave config.yaml on the old version while the image is
          # already pushed, so every hourly run would push it again.
          grep -qxF "version: \"${VERSION}\"" bambuddy/config.yaml \
            || { echo "::error::version bump to ${VERSION} did not apply to bambuddy/config.yaml"; exit 1; }
          # Stable keeps a running changelog: newest version on top, last
          # MAX_SECTIONS versions kept. HA's update dialog shows everything from
          # the "## <new version>" heading down to "## <installed version>".
          BODY="$BODY" VER="$VERSION" python3 - <<'PYEOF'
          import os
          import re

          MAX_SECTIONS = 15
          path = "bambuddy/CHANGELOG.md"
          ver = os.environ["VER"]
          body = os.environ.get("BODY", "").replace("\r\n", "\n").replace("\r", "\n").strip()

          try:
              with open(path, encoding="utf-8") as f:
                  old = f.read().replace("\r\n", "\n").replace("\r", "\n")
          except FileNotFoundError:
              old = ""

          # Split only at real version headings ("## 1.2.5.5"), not at headings
          # inside the upstream release notes ("### Added", ...).
          heading = re.compile(r"^## \d+(?:\.\d+)+[ \t]*$", re.MULTILINE)
          starts = [m.start() for m in heading.finditer(old)]
          sections = [old[s:e].strip("\n") for s, e in zip(starts, starts[1:] + [len(old)])]
          sections = [s for s in sections if s.split("\n", 1)[0].strip() != f"## {ver}"]

          new = f"## {ver}\n\n{body}" if body else f"## {ver}"
          sections = [new] + sections

          with open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write("\n\n".join(sections[:MAX_SECTIONS]) + "\n")
          print(f"CHANGELOG.md updated ({min(len(sections), MAX_SECTIONS)} versions)")
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bambuddy/config.yaml bambuddy/CHANGELOG.md
          git commit -m "chore: update BamBuddy ${{ needs.check-stable.outputs.current }} -> ${{ needs.check-stable.outputs.version }}"
          git push

  # ============================================================
  # DAILY: check -> test -> build -> commit
  # ============================================================
  check-daily:
    name: Check DAILY
    runs-on: ubuntu-24.04
    concurrency:
      group: update-daily
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.decide.outputs.changed == 'true' && steps.blocked.outputs.blocked != 'true' }}
      version: ${{ steps.get_digest.outputs.version }}
      digest: ${{ steps.get_digest.outputs.digest }}
      current: ${{ steps.get_current.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Get latest daily digest and version
        id: get_digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN=$(curl -s --retry 3 --retry-delay 5 --retry-all-errors "https://ghcr.io/token?scope=repository:maziggy/bambuddy:pull" \
            | jq -r '.token')

          DIGEST=$(curl -sI --retry 3 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/maziggy/bambuddy/manifests/daily" \
            | grep -i "docker-content-digest" | tr -d '\r' | awk '{print $2}')

          if [ -z "$DIGEST" ]; then
            echo "ERROR: Digest could not be fetched!"
            exit 1
          fi

          SHORT=$(echo "$DIGEST" | cut -c8-15)

          # The multi-arch index digest of :daily at this moment. Test and build
          # pin their base to it, and commit-daily records it next to the
          # version, so a later manual build reproduces exactly this stand.
          if ! echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "ERROR: unexpected digest format: $DIGEST"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          REL=$(curl -s --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/maziggy/bambuddy/releases?per_page=10")

          if ! echo "$REL" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::warning::GitHub API did not return a release array (rate limit / transient). Skipping this run."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_TAG=$(echo "$REL" | jq -r '[.[] | select(.prerelease == true)] | first | .tag_name // empty' | sed 's/^v//')

          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "null" ]; then
            DATE=$(date +%Y.%m.%d)
            RELEASE_TAG="${DATE}-${SHORT}"
          fi

          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $RELEASE_TAG"

      - name: Get current version from config.yaml
        id: get_current
        run: |
          CURRENT=$(grep '^version:' bambuddy-daily/config.yaml | sed 's/.*"\(.*\)"/\1/')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT"

      - name: Decide
        id: decide
        run: |
          V="${{ steps.get_digest.outputs.version }}"
          # A missing or broken upstream.digest counts as a change too: then the
          # current :daily is built, tested and pinned together with its version.
          # This bootstraps the file and heals it if it is ever deleted.
          PINNED=true
          grep -Eqx 'sha256:[0-9a-f]{64}' bambuddy-daily/upstream.digest 2>/dev/null || PINNED=false
          if [ -n "$V" ] && [ "$V" != "null" ] \
             && { [ "$V" != "${{ steps.get_current.outputs.current }}" ] || [ "$PINNED" = false ]; }; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream.digest pinned: $PINNED"

      - name: Skip a version that already failed its tests
        id: blocked
        if: steps.decide.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed test run opens an issue naming the version. Without this
          # check the hourly cron would rebuild and retest the same broken
          # version every hour. Closing the issue releases the version again.
          TITLE="Auto-update blocked: daily ${{ steps.get_digest.outputs.version }}"
          FOUND=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json title \
            --jq "[.[] | select(.title == \"${TITLE}\")] | length")
          if [ "${FOUND}" != "0" ]; then
            echo "::notice::Skipping ${TITLE} - an open issue still blocks it"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

  test-daily:
    name: Test DAILY
    needs: check-daily
    if: needs.check-daily.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml
    with:
      context: bambuddy-daily
      version: ${{ needs.check-daily.outputs.version }}
      digest: ${{ needs.check-daily.outputs.digest }}
      smoke: true

  block-daily:
    name: Block DAILY on test failure
    needs: [check-daily, test-daily]
    if: always() && needs.test-daily.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open a blocking issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-daily.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Auto-update blocked: daily ${VERSION}"
          # printf, not a heredoc: inside a YAML block scalar the closing EOF
          # would be indented and would never terminate the heredoc.
          BODY=$(printf '%s\n' \
            "The DAILY auto-update to \`${VERSION}\` was stopped: the tests failed" \
            "before anything was pushed to GHCR or committed to \`config.yaml\`." \
            "" \
            "Failed run: ${RUN_URL}" \
            "" \
            "Nothing is broken for users - Home Assistant still serves the previous" \
            "version. The hourly job skips this version while this issue is open." \
            "" \
            "**Close this issue once the cause is fixed**, then the next run picks" \
            "the version up again.")
          gh issue create --title "${TITLE}" --label "bug" --body "${BODY}"

  build-daily:
    name: Build DAILY
    needs: [check-daily, test-daily]
    if: needs.check-daily.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      context: bambuddy-daily
      image: ghcr.io/spegeli/homeassistant-app-bambuddy-daily
      version: ${{ needs.check-daily.outputs.version }}
      digest: ${{ needs.check-daily.outputs.digest }}

  commit-daily:
    name: Commit DAILY
    needs: [check-daily, build-daily]
    if: needs.check-daily.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Apply update and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check-daily.outputs.version }}"
          BODY=$(curl -s --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/maziggy/bambuddy/releases/tags/v${VERSION}" | jq -r '.body // empty')
          sed -i 's/^version: ".*"/version: "${{ needs.check-daily.outputs.version }}"/' bambuddy-daily/config.yaml
          # Fail loudly if the bump did not land (e.g. the version: line was
          # reformatted and sed no longer matches). Silently committing nothing
          # would leave config.yaml on the old version while the image is
          # already pushed, so every hourly run would push it again.
          grep -qxF "version: \"${VERSION}\"" bambuddy-daily/config.yaml \
            || { echo "::error::version bump to ${VERSION} did not apply to bambuddy-daily/config.yaml"; exit 1; }
          # Record the upstream stand this version was tested and built from, in
          # the same commit as the version. Manual builds read it from here.
          DIGEST="${{ needs.check-daily.outputs.digest }}"
          grep -Eqx 'sha256:[0-9a-f]{64}' <<<"${DIGEST}" \
            || { echo "::error::invalid upstream digest '${DIGEST}'"; exit 1; }
          echo "${DIGEST}" > bambuddy-daily/upstream.digest
          BODY="$BODY" VER="$VERSION" python3 - <<'PYEOF'
          import os
          # Daily keeps only the latest release notes (overwrite on purpose).
          body = os.environ.get("BODY", "").replace("\r\n", "\n").replace("\r", "\n").strip()
          with open("bambuddy-daily/CHANGELOG.md", "w", encoding="utf-8", newline="\n") as f:
              f.write(f"## {os.environ['VER']}\n\n{body}\n")
          print("CHANGELOG.md updated")
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bambuddy-daily/config.yaml bambuddy-daily/CHANGELOG.md bambuddy-daily/upstream.digest
          if [ "${{ needs.check-daily.outputs.current }}" = "${VERSION}" ]; then
            # Same version, only the missing digest was pinned (bootstrap/heal).
            git commit -m "chore: pin BamBuddy Daily ${VERSION} to upstream ${DIGEST:7:12}"
          else
            git commit -m "chore: update BamBuddy Daily ${{ needs.check-daily.outputs.current }} -> ${VERSION}"
          fi
          git push
