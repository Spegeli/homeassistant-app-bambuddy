name: Test

run-name: ${{ inputs.smoke && format('Test {0}', inputs.channel) || format('Test {0} (lint only)', inputs.channel) }}

# Manual only, like the build workflow. Small commits should not each trigger
# a container build, so the tests run when you decide they should. They still
# run automatically where they act as a gate: in auto-update before
# anything is pushed or committed, and in build.yml before it publishes.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to test"
        type: choice
        options: [both, stable, daily]
        default: both
      smoke:
        description: "Also build the image and run the container tests"
        type: boolean
        default: true

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stable:
    name: STABLE
    if: inputs.channel == 'both' || inputs.channel == 'stable'
    uses: ./.github/workflows/_test.yml
    with:
      context: bambuddy
      smoke: ${{ inputs.smoke == true || inputs.smoke == 'true' }}

  daily:
    name: DAILY
    if: inputs.channel == 'both' || inputs.channel == 'daily'
    uses: ./.github/workflows/_test.yml
    with:
      context: bambuddy-daily
      smoke: ${{ inputs.smoke == true || inputs.smoke == 'true' }}
