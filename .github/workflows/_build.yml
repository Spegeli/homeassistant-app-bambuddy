name: Build image (internal)

# Reusable workflow (workflow_call): builds each architecture natively,
# pushes by digest and merges both into one multi-arch tag. Not runnable on
# its own - called by build.yml and by update-versions.yml.

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      image:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ''
      digest:
        description: "Upstream base digest (daily); defaults to <context>/upstream.digest"
        required: false
        type: string
        default: ''

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      digest_arg: ${{ steps.v.outputs.digest_arg }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Resolve version and upstream digest
        id: v
        run: bash .github/scripts/resolve-build-args.sh "${{ inputs.context }}" "${{ inputs.version }}" "${{ inputs.digest }}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            ha_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            ha_arch: aarch64

    steps:
      - name: Prepare
        run: |
          echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: ${{ matrix.platform }}
          provenance: false
          # digest_arg is empty for stable; build-push-action drops empty lines.
          build-args: |
            BAMBUDDY_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
            ${{ needs.prepare.outputs.digest_arg }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          # The word splitting is the point here: one file per architecture
          # digest, expanded into separate arguments for imagetools create.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t ${{ inputs.image }}:${{ needs.prepare.outputs.version }} \
            -t ${{ inputs.image }}:latest \
            $(printf '${{ inputs.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ inputs.image }}:${{ needs.prepare.outputs.version }}
