name: Build STABLE image

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Push without running the tests first (use only to re-publish a known-good build)"
        type: boolean
        default: false

jobs:
  test:
    name: Test
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/_test.yml
    with:
      context: bambuddy
      smoke: true
    permissions:
      contents: read

  build:
    needs: test
    # The test job is skipped when skip_tests is set; always() lets the build
    # run then, but a real test failure still stops it.
    if: always() && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    uses: ./.github/workflows/_build-image.yml
    with:
      context: bambuddy
      image: ghcr.io/spegeli/homeassistant-app-bambuddy
    permissions:
      contents: read
      packages: write
